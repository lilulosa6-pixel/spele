<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #95b1db; color: #222222; }
h1 { color: #0f3052; }
.noteikumi { background-color: #d2e5f0; padding: 12px; border-radius: 12px;}
button { background-color: #245b91; color: #ffffff; border: 0; }
</style>
</head>
<body>
<h1>Mērkaķu medības</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Spied uz mērkaķa, lai iegūtu punktu.</p>
  <p>Uzvara ir pie pieciem punktiem.</p>
  <p>Kad spēlētajs zaudē, viņam ir jāpagaida līdz spēle sākās no sākuma.</p>
 </section>
<button>Sākt spēli</button>
</body>
</html>
