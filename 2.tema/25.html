<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mērkaķu medības</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #edf5ff; color: #17212b; }
button { background-color: #245b91; color: white; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Mērkaķu mednieks</h1>
<p>Savāc piecus mērkaķus. Spied uz mērkaķa, lai iegūtu punktus.</p>
<img src="atteli/merkaku medibas.png" alt="Mednieks ar lielu cepuri un sietiņu." width="700">
<p>Uzvaras skaņa:</p>
<audio controls src="klikskis.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">Savākt mērkaķi</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
